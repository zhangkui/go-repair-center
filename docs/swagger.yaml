openapi: 3.0.3
info:
  title: go-repair-center
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/login:
    post:
      summary: Login with username and password
      requestBody:
        required: true
      responses:
        "200":
          description: Success
  /me:
    get:
      summary: Current authenticated user
      responses:
        "200":
          description: Success
  /dashboard:
    get:
      summary: Dashboard summary
      responses:
        "200":
          description: Success
  /users:
    get:
      summary: User list
      responses:
        "200":
          description: Success
    post:
      summary: Create user
      responses:
        "201":
          description: Created
  /repair-orders:
    get:
      summary: Repair order list
      responses:
        "200":
          description: Success
    post:
      summary: Create repair order
      responses:
        "201":
          description: Created
  /parts:
    get:
      summary: Part inventory list
      responses:
        "200":
          description: Success
  /feedbacks:
    get:
      summary: Feedback list
      responses:
        "200":
          description: Success
